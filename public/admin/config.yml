                  - { name: openDiscussion, label: 打开讨论链接, widget: string }

      - name: resume
        label: 简历内容
        file: src/data/resume.json
        format: json
        fields:
          - { name: seoDescription, label: 搜索摘要, widget: text, hint: 用于简历页 description，改完直接生效 }
          - name: intro
            label: 首屏文案
            widget: object
            fields:
              - { name: eyebrow, label: 英文眉题, widget: string }
              - { name: title, label: 主标题, widget: string }
              - { name: summary, label: 自我介绍, widget: text }
          - name: facts
            label: 求职信息
            widget: list
            min: 1
            fields:
              - { name: label, label: 标签, widget: string }
              - { name: value, label: 内容, widget: string }
          - name: highlights
            label: 核心优势
            widget: list
            min: 1
            fields:
              - { name: title, label: 标题, widget: string }
              - { name: description, label: 说明, widget: text }
          - name: stackGroups
            label: 技术栈分组
            widget: list
            min: 1
            fields:
              - { name: label, label: 分组名, widget: string }
              - name: items
                label: 技术项
                widget: list
                min: 1
                hint: 每行一项；空行会被忽略
          - name: projectExperiences
            label: 代表项目
            widget: list
            min: 1
            hint: slug 必须是已发布项目的 slug；填错时该项会在页面上被跳过
            fields:
              - { name: slug, label: 项目 slug, widget: string, pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能是小写英文、数字与连字符'] }
              - { name: contribution, label: 参与说明, widget: text }
          - name: statLabels
            label: 概览单位
            widget: object
            hint: 数字自动取自项目库，这里只改「个公开项目」这类单位文案
            fields:
              - { name: projects, label: 项目数单位, widget: string }
              - { name: categories, label: 分类数单位, widget: string }
              - { name: experiences, label: 案例数单位, widget: string }
          - name: workHistory
            label: 工作经历
            widget: list
            min: 1
            fields:
              - { name: company, label: 公司, widget: string }
              - { name: role, label: 岗位, widget: string }
              - { name: team, label: 部门, widget: string }
              - { name: period, label: 起止时间, widget: string }
              - { name: summary, label: 职责概述, widget: text }
              - name: points
                label: 工作要点
                widget: list
                min: 1
                hint: 每行一条；空行会被忽略
          - name: education
            label: 教育背景
            widget: object
            fields:
              - { name: school, label: 院校 / 状态, widget: string }
              - { name: detail, label: 说明, widget: text }
          - name: workflow
            label: 工作方式
            widget: list
            min: 1
            fields:
              - { name: title, label: 步骤名, widget: string }
              - { name: description, label: 说明, widget: text }
          - { name: contactHeading, label: 联系区标题, widget: string }

  - name: articles
    label: 文章
    label_singular: 文章
    icon: article
    folder: src/content/articles
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}} — {{publishedAt}}'
    sortable_fields: [publishedAt, title]
    slug:
      template: '{{slug}}'
      editable: [create]
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用英文小写字母、数字和连字符']
      hint: 英文短名，决定文章 URL。标题是中文时自动生成的 slug 会带上中文而无法通过校验，请手动改成英文小写短名（如 ai-daily-tools）；保存后仍可在侧栏重命名
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 摘要, widget: text, hint: 用于列表与 SEO 描述 }
      - name: publishedAt
        label: 发布日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - name: updatedAt
        label: 更新日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        required: false
      - { name: tags, label: 标签, widget: list, default: [], required: false }
      - { name: project, label: 所属项目, widget: string, required: false, hint: '填项目的英文短名（slug），如 robot-forum-miniapp；留空表示独立笔记。填写后文章页会显示该项目，项目页也会列出这篇文章' }
      - { name: cover, label: 封面, widget: image, choose_url: false, required: false, hint: 上传的图片会自动转为 WebP 并压缩到 512 KB 内，文件名自动转英文小写 }
      - { name: featured, label: 首页精选, widget: boolean, default: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会出现在线上 }
      - { name: body, label: 正文, widget: markdown }

  - name: projects
    label: 项目
    label_singular: 项目
    icon: folder_special
    folder: src/content/projects
    extension: md
    format: frontmatter
    identifier_field: title
    summary: '{{title}} — {{category}}'
    sortable_fields: [publishedAt, title]
    slug:
      template: '{{slug}}'
      editable: [create]
      pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', '只能用英文小写字母、数字和连字符']
      hint: 英文短名，决定项目 URL。标题是中文时自动生成的 slug 会带上中文而无法通过校验，请手动改成英文小写短名（如 personal-site）；保存后仍可在侧栏重命名
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 摘要, widget: text, hint: 用于列表与 SEO 描述 }
      - name: publishedAt
        label: 发布日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
      - name: updatedAt
        label: 更新日期
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        required: false
      - name: status
        label: 项目状态
        widget: select
        options:
          - { label: 进行中, value: active }
          - { label: 已完成, value: completed }
          - { label: 已归档, value: archived }
        default: completed
      - name: category
        label: 分类
        widget: string
        hint: 必须与「项目页配置 → 项目分类清单」里的某一项完全一致；保存时会校验，不一致会拦下并列出可选分类
      - { name: tech, label: 技术栈, widget: list, default: [], required: false }
      - { name: cover, label: 封面, widget: image, choose_url: false, required: false, hint: 必须有仓库内封面（公开与私有项目都一样）；缺失时该项目不会发布，但构建不会失败 }
      - name: screenshots
        label: 项目截图
        widget: list
        required: false
        max: 6
        hint: 可留空或先传 1–3 张，建议 4–6 张；上传后自动转为 WebP 并压缩到 512 KB 内，文件名自动转英文小写；宽高由构建自动读取，无需手填
        fields:
          - { name: src, label: 图片, widget: image, choose_url: false }
          - { name: alt, label: 替代文本, widget: string }
          - { name: title, label: 标题, widget: string }
          - { name: caption, label: 说明, widget: string }
          - name: viewport
            label: 视口
            widget: select
            options: [desktop, mobile]
          - { name: width, label: 宽度, widget: number, value_type: int, min: 1, required: false, hint: 可留空，构建自动读取图片实际像素；仅在图片格式无法识别时作为兜底 }
          - { name: height, label: 高度, widget: number, value_type: int, min: 1, required: false, hint: 可留空，构建自动读取图片实际像素；仅在图片格式无法识别时作为兜底 }
      - name: modules
        label: 功能模块
        widget: list
        required: false
        hint: 留空则整个「产品能力」区块不显示；填了才会渲染模块卡片
        fields:
          - { name: name, label: 模块名, widget: string }
          - { name: description, label: 描述, widget: text }
          - { name: features, label: 功能点, widget: list, min: 1 }
      - name: roles
        label: 协作角色
        widget: list
        required: false
        hint: 留空则不显示角色分工；需与「功能模块」等至少一项同时填写才会出现能力区
        fields:
          - { name: name, label: 角色, widget: string }
          - { name: scope, label: 职责范围, widget: text }
      - name: workflow
        label: 交付流程
        widget: list
        required: false
        hint: 留空则不显示交付流程；需与「功能模块」等至少一项同时填写才会出现能力区
        fields:
          - { name: label, label: 阶段, widget: string }
          - { name: status, label: 状态, widget: string }
      - name: metrics
        label: 关键指标
        widget: list
        required: false
        hint: 留空则不显示关键指标；需与「功能模块」等至少一项同时填写才会出现能力区
        fields:
          - { name: label, label: 指标名, widget: string }
          - { name: value, label: 数值, widget: string }
          - { name: trend, label: 趋势, widget: string }
      - { name: integrations, label: 集成服务, widget: list, required: false, hint: 留空则不显示集成边界；需与「功能模块」等至少一项同时填写才会出现能力区 }
      - name: demoUrl
        label: 演示地址
        widget: string
        required: false
        pattern: ['^https://\S+$', '必须是完整的 HTTPS 链接，如 https://example.com']
        hint: 填写后项目页显示「在线体验」按钮，留空则不显示
      - name: repoUrl
        label: 源码地址
        widget: string
        required: false
        pattern: ['^https://(github|gitee)\.com/', '必须是 GitHub 或 Gitee 的 HTTPS 地址']
        hint: 私有项目不要填写；公开项目必须填写，否则该项目不会发布（构建不会失败）
      - { name: repoLabel, label: 源码按钮文案, widget: string, required: false, hint: 留空默认显示「GitHub 源码」，Gitee 仓库请改成「Gitee 源码」 }
      - name: sourceVisibility
        label: 源码可见性
        widget: select
        options:
          - { label: 公开, value: public }
          - { label: 私有, value: private }
        default: public
        hint: 公开必须填源码地址，私有不能填源码地址/代码仓库；不一致的项目不会发布
      - name: repositories
        label: 代码仓库
        widget: list
        required: false
        hint: 私有项目请留空；只有公开源码项目才填写。留空则不显示「产品全景」区块
        fields:
          - { name: name, label: 仓库名, widget: string }
          - name: role
            label: 仓库角色
            widget: select
            options:
              - { label: 前端, value: frontend }
              - { label: 管理后台, value: admin }
              - { label: 后端, value: backend }
              - { label: 内容, value: content }
          - { name: description, label: 描述, widget: text }
          - { name: tech, label: 技术栈, widget: list, min: 1 }
          - name: url
            label: 仓库地址
            widget: string
            pattern: ['^https://(github|gitee)\.com/', '必须是 GitHub 或 Gitee 的 HTTPS 地址']
      - { name: featured, label: 首页精选, widget: boolean, default: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会出现在线上 }
      - { name: body, label: 正文, widget: markdown }
