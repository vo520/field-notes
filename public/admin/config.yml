                    field: { name: text, label: 步骤, widget: string }
                  - { name: groupGuestbook, label: 留言板分组名, widget: string }
                  - { name: groupArticles, label: 文章分组名, widget: string }
                  - { name: groupProjects, label: 项目分组名, widget: string }
