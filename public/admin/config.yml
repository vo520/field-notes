            fields:
              - { name: cmsTitleTemplate, label: 后台入口标题模板, widget: string, pattern: ['\{name\}', '必须包含 {name} 占位符'], hint: '必须包含 {name}' }
              - name: review
                label: 留言审核页
                widget: object
                fields:
                  - { name: title, label: 页面标题, widget: string }
                  - { name: description, label: 页面描述, widget: text }
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: introTemplate, label: 页面说明模板, widget: text, pattern: ['^(?=[\s\S]*\{repo\})(?=[\s\S]*\{category\})', '必须包含 {repo} 与 {category} 占位符'], hint: '必须包含 {repo} 与 {category}' }
                  - { name: allDiscussions, label: 全部讨论标题, widget: string }
                  - { name: allDiscussionsHintTemplate, label: 全部讨论提示模板, widget: string, pattern: ['\{repo\}', '必须包含 {repo} 占位符'], hint: '必须包含 {repo}' }
                  - { name: guestbookDiscussions, label: 留言板讨论标题, widget: string }
                  - { name: guestbookHint, label: 留言板讨论提示, widget: string }
