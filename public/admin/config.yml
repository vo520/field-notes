                widget: object
                fields:
                  - { name: active, label: 进行中, widget: string }
                  - { name: completed, label: 已完成, widget: string }
                  - { name: archived, label: 已归档, widget: string }
              - name: meta
                label: 项目信息标签
                widget: object
                fields:
                  - { name: publishedAt, label: 发布日期, widget: string }
                  - { name: status, label: 当前状态, widget: string }
                  - { name: source, label: 源码, widget: string }
                  - { name: tech, label: 技术与方向, widget: string }
              - name: panorama
