              - { name: eyebrowTemplate, label: 页头小标题模板, widget: string, pattern: ['\{status\}', '必须包含 {status} 占位符'], hint: '必须包含 {status}，构建时替换为项目状态' }
              - name: screenshots
                label: 界面截图区
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: intro, label: 说明, widget: text }
                  - { name: open, label: 查看大图按钮, widget: string }
                  - { name: thumbnailsAriaLabel, label: 缩略图区无障碍标签, widget: string }
                  - { name: thumbnailAriaTemplate, label: 缩略图无障碍模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '必须包含 {title}' }
                  - { name: dialogAriaTemplate, label: 大图预览无障碍模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '必须包含 {title}' }
                  - { name: closeAriaLabel, label: 关闭大图无障碍标签, widget: string }
                  - { name: prevAriaLabel, label: 上一张无障碍标签, widget: string }
                  - { name: nextAriaLabel, label: 下一张无障碍标签, widget: string }
              - name: capabilities
                label: 产品能力区
                widget: object
                hint: 仅在项目填了功能模块 / 协作角色 / 交付流程 / 关键指标 / 集成服务中至少一项时显示
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: intro, label: 说明, widget: text }
                  - { name: modules, label: 产品模块, widget: string }
                  - { name: roles, label: 角色与权限, widget: string }
                  - { name: metrics, label: 运营指标, widget: string }
                  - { name: workflow, label: 业务流程, widget: string }
                  - { name: integrations, label: 技术与集成边界, widget: string }
              - name: repository
                label: 关联源码区
                widget: object
                hint: 仅在项目的「代码仓库」非空时显示
                fields:
                  - { name: listAriaLabel, label: 源码区无障碍标签, widget: string }
                  - { name: techAriaTemplate, label: 技术栈无障碍模板, widget: string, pattern: ['\{name\}', '必须包含 {name} 占位符'], hint: '必须包含 {name}' }
                  - { name: sourceLinkTemplate, label: 源码链接模板, widget: string, pattern: ['\{role\}', '必须包含 {role} 占位符'], hint: '必须包含 {role}' }
                  - name: roles
                    label: 仓库角色名称
                    widget: object
                    fields:
                      - { name: frontend, label: 前端, widget: string }
                      - { name: admin, label: 管理后台, widget: string }
                      - { name: backend, label: 后端, widget: string }
                      - { name: content, label: 内容, widget: string }

      - name: discovery
        label: 搜索与留言
