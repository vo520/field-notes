              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: heading, label: 标题, widget: string }
              - { name: description, label: 说明, widget: text }
              - { name: label, label: 输入框标签, widget: string }
              - { name: placeholder, label: 输入框提示, widget: string }
              - { name: clear, label: 清除按钮, widget: string }
              - { name: hint, label: 初始提示, widget: string }
              - { name: searching, label: 搜索中提示, widget: string }
              - { name: resultTemplate, label: 结果数量模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}' }
              - { name: emptyTemplate, label: 空结果模板, widget: string, pattern: ['\{query\}', '必须包含 {query} 占位符'], hint: '必须包含 {query}' }
