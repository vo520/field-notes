backend:
  name: github
  repo: vo520/field-notes
  branch: main
  base_url: https://cms-auth.ytn520.top

site_url: https://blog.ytn520.top
display_url: https://blog.ytn520.top
logo:
  src: https://blog.ytn520.top/favicon.svg
publish_mode: simple

media_folder: public/images/uploads
public_folder: /images/uploads

# 上传即符合仓库约束：文件名自动转小写连字符，超出体积上限直接拦在 CMS 里；
# 图片顺便转成 WebP，避免 512 KB 上限让正常截图传不上去。
# 这些设置与 tests/images.test.ts 的校验一一对应，改动后请同步测试。
media_libraries:
  all:
    max_file_size: 524288
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2048
        height: 2048
      svg:
        optimize: true
  default:
    config:
      slugify_filename: true

collections:
  - name: settings
    label: 站点信息
    icon: settings
    files:
      - name: site
        label: 站点身份
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: 站点名称, widget: string }
          - { name: brand, label: 页脚品牌, widget: string, hint: 页脚左侧的品牌文案 }
          - { name: brandMark, label: 站标字符, widget: string, hint: 顶部品牌方块里的字符，建议 1 个 }
          - { name: title, label: 浏览器标题, widget: string, hint: 首页标题与 OG 图标题；RSS 订阅标题由下方「RSS 订阅标题模板」控制 }
          - { name: titleSeparator, label: 页面标题分隔符, widget: string, hint: 用于「页面标题 + 分隔符 + 站点名称」，建议保留前后空格 }
          - { name: rssTitleTemplate, label: RSS 订阅标题模板, widget: string, pattern: ['\{name\}', '必须包含 {name} 占位符'], hint: '必须包含 {name}' }
          - { name: description, label: 站点描述, widget: text, hint: 首页与 RSS 的默认描述 }
          - name: author
            label: 作者身份
            widget: object
            hint: 这里的姓名与岗位会同步到页面标题、社交图、JSON-LD 与简历结构化数据；简历正文请到左侧「简历内容」修改
            fields:
              - { name: name, label: 姓名, widget: string }
              - { name: role, label: 岗位 / 角色, widget: string, hint: '当前为「全站开发」；改完会同步全站身份与搜索结果中的职称' }
              - { name: bio, label: 简介, widget: text, hint: 用于关于页与社交场景的个人介绍 }
          - name: social
            label: 社交链接
            widget: object
            fields:
              - { name: github, label: GitHub, widget: string, required: false, pattern: ['^https?://\S+$', '必须是完整的 http(s) 链接，如 https://github.com/xxx'] }
              - { name: gitee, label: Gitee, widget: string, required: false, pattern: ['^https?://\S+$', '必须是完整的 http(s) 链接，如 https://gitee.com/xxx'] }
              - { name: email, label: 邮箱, widget: string, required: false, hint: 留空则不展示邮箱入口 }
              - { name: wechat, label: 微信, widget: string, required: false, hint: 留空则不展示微信号 }
              - { name: wechatQr, label: 微信二维码, widget: image, choose_url: false, required: false, pattern: ['^/images/(?:[a-z0-9]+(?:-[a-z0-9]+)*/)*[a-z0-9]+(?:-[a-z0-9]+)*\.(?:png|jpe?g|webp|avif|svg)$', '需为 /images 下小写英文、数字与连字符命名的图片路径，如 /images/uploads/wechat-qr.png'], hint: 选择或上传正方形二维码图片，建议小于 512KB、文件名用小写英文与连字符；留空则只展示微信号，清空时请同时删除旧图片 }
          - name: nav
            label: 顶部导航
            widget: list
            min: 1
            hint: 链接以 / 开头，修改后需保证对应页面存在
            fields:
              - { name: href, label: 链接, widget: string, pattern: ['^/', '必须是站内路径，以 / 开头，如 /projects/'] }
              - { name: label, label: 文案, widget: string }
          - name: footer
            label: 页脚
            widget: object
            fields:
              - { name: linksAriaLabel, label: 链接区无障碍标签, widget: string }
              - { name: emailLabel, label: 邮箱入口文案, widget: string }
              - { name: githubLabel, label: GitHub 入口文案, widget: string }
              - { name: giteeLabel, label: Gitee 入口文案, widget: string }
              - { name: copyrightTemplate, label: 版权行模板, widget: string, pattern: ['^(?=[\s\S]*\{year\})(?=[\s\S]*\{name\})', '必须包含 {year} 与 {name} 占位符'], hint: '必须包含 {year} 与 {name}' }
              - name: links
                label: 固定链接
                widget: list
                min: 1
                hint: 只含站内固定入口；GitHub / Gitee / 邮箱仍由「社交链接」控制
                fields:
                  - { name: href, label: 链接, widget: string, pattern: ['^/', '必须是站内路径，以 / 开头，如 /articles/'] }
                  - { name: label, label: 文案, widget: string }
              - { name: techNote, label: 技术说明, widget: string }
          - name: og
            label: 社交图文案
            widget: object
            hint: 更换后需重新运行 OG 图片生成脚本才会生效
            fields:
              - { name: rootLabel, label: 首页英文标签, widget: string }
              - { name: articleLabel, label: 文章英文标签, widget: string }
              - { name: projectLabel, label: 项目英文标签, widget: string }
          - name: crumbs
            label: 面包屑
            widget: object
            fields:
              - { name: ariaLabel, label: 无障碍标签, widget: string }
              - { name: home, label: 首页, widget: string }
              - { name: projects, label: 项目, widget: string }
              - { name: projectCategories, label: 项目分类, widget: string }
              - { name: articles, label: 文章, widget: string }
              - { name: archive, label: 归档, widget: string }
              - { name: tags, label: 标签, widget: string }
              - { name: guestbook, label: 留言, widget: string }
              - { name: search, label: 搜索, widget: string }


      - name: chrome
        label: 界面与导航控件
        file: src/data/chrome.json
        format: json
        fields:
          - name: header
            label: 顶部导航栏
            widget: object
            fields:
              - { name: brandAriaTemplate, label: 站标无障碍模板, widget: string, pattern: ['\{name\}', '必须包含 {name} 占位符'], hint: '必须包含 {name}' }
              - { name: navAriaLabel, label: 导航无障碍标签, widget: string }
              - { name: searchLabel, label: 搜索入口文案, widget: string }
              - { name: menuOpen, label: 打开菜单无障碍标签, widget: string }
              - { name: menuClose, label: 关闭菜单无障碍标签, widget: string }
          - name: themeToggle
            label: 主题切换
            widget: object
            fields:
              - { name: title, label: 悬停提示, widget: string }
              - { name: lightLabel, label: 浅色模式文案, widget: string }
              - { name: darkLabel, label: 深色模式文案, widget: string }
              - { name: switchToDark, label: 切换到深色提示, widget: string }
              - { name: switchToLight, label: 切换到浅色提示, widget: string }
          - name: ui
            label: 通用控件文案
            widget: object
            hint: 顶部之外的全局小部件、卡片动作、代码复制与评论区文案
            fields:
              - { name: skipLink, label: 跳过导航文案, widget: string }
              - { name: backToTop, label: 返回顶部无障碍标签, widget: string }
              - { name: tagListAriaLabel, label: 标签列表无障碍标签, widget: string }
              - { name: sectionLinkFallback, label: 区块入口默认文案, widget: string, hint: 区块标题未单独填写「查看全部」时使用 }
              - { name: projectCountAriaTemplate, label: 项目数量无障碍模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}' }
              - name: contentCard
                label: 文章卡片
                widget: object
                fields:
                  - { name: readAriaTemplate, label: 卡片无障碍模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '必须包含 {title}' }
                  - { name: readFallback, label: 卡片默认动作文案, widget: string }
              - name: projectCard
                label: 项目卡片
                widget: object
                fields:
                  - { name: viewAriaTemplate, label: 查看项目无障碍模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '必须包含 {title}' }
                  - { name: repositoryCountLabel, label: 关联仓库数量单位, widget: string, hint: 数字由仓库数自动生成 }
                  - { name: privateSource, label: 私有源码说明, widget: string }
                  - { name: noPublicRepo, label: 暂无公开仓库说明, widget: string }
                  - { name: viewDetail, label: 查看详情按钮, widget: string }
                  - { name: source, label: 源码按钮, widget: string }
              - name: codeCopy
                label: 代码复制
                widget: object
                fields:
                  - { name: copy, label: 复制按钮, widget: string }
                  - { name: copied, label: 复制成功文案, widget: string }
                  - { name: copyFailed, label: 复制失败文案, widget: string }
                  - { name: ariaLabel, label: 复制按钮无障碍标签, widget: string }
                  - { name: copiedAnnounce, label: 成功播报, widget: string }
                  - { name: failedAnnounce, label: 失败播报, widget: string }
              - name: comments
                label: 评论区
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: defaultTitle, label: 默认标题, widget: string }
                  - { name: intro, label: 说明, widget: text }
                  - { name: loading, label: 加载中提示, widget: string }
                  - { name: error, label: 加载失败提示, widget: string }
                  - { name: retry, label: 重试按钮, widget: string }
          - name: notFound
            label: 404 页
            widget: object
            fields:
              - { name: title, label: 浏览器标题, widget: string }
              - { name: description, label: 页面描述, widget: string }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: heading, label: 大标题, widget: string }
              - { name: message, label: 说明, widget: text }
              - { name: backHome, label: 返回首页按钮, widget: string }

      - name: home
        label: 首页配置
        file: src/data/home.json
        format: json
        fields:
          - name: home
            label: 首页
            widget: object
            fields:
              - { name: heroTitle, label: Hero 主标题, widget: string }
              - { name: projectsCta, label: 项目按钮文案, widget: string }
              - { name: articlesCta, label: 文章按钮文案, widget: string }
              - { name: featuredLabel, label: 精选项目标签, widget: string }
              - { name: heroProjectsAriaLabel, label: 精选项目无障碍标签, widget: string, hint: 供屏幕阅读器识别项目区 }
              - { name: featuredAllTemplate, label: 查看全部文案模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}，构建时替换为项目总数' }
              - { name: statsAriaLabel, label: 统计栏无障碍标签, widget: string }
              - name: stats
                label: 统计栏
                widget: object
                fields:
                  - name: delivery
                    label: 第一项
                    widget: object
                    fields:
                      - { name: value, label: 主文案, widget: string }
                      - { name: label, label: 说明, widget: string }
                  - { name: projectCountLabel, label: 项目数量说明, widget: string, hint: 数字由项目数自动生成，这里只填单位与说明 }
                  - name: interaction
                    label: 第三项
                    widget: object
                    fields:
                      - { name: value, label: 主文案, widget: string }
                      - { name: label, label: 说明, widget: string }
              - name: promise
                label: 开源承诺条
                widget: object
                fields:
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
                  - { name: cta, label: 按钮文案, widget: string }
              - name: projectsSection
                label: 项目区块标题
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
                  - { name: cta, label: 右侧按钮文案, widget: string }
              - name: articlesSection
                label: 文章区块标题
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: cta, label: 右侧按钮文案, widget: string }

      - name: about
        label: 关于页
        file: src/data/about.json
        format: json
        fields:
          - name: about
            label: 关于页
            widget: object
            fields:
              - { name: metaTitleTemplate, label: 浏览器标题模板, widget: string, pattern: ['\{name\}', '必须包含 {name} 占位符'], hint: '必须包含 {name}' }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: title, label: 主标题, widget: string }
              - { name: factsAriaLabel, label: 简介无障碍标签, widget: string }
              - name: facts
                label: 简介事实
                widget: list
                min: 1
                fields:
                  - { name: value, label: 主文案, widget: string }
                  - { name: label, label: 说明, widget: string }
              - name: work
                label: 工作方向
                widget: list
                min: 1
                hint: 序号按顺序自动生成
                fields:
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
              - name: site
                label: 关于本站
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
                  - name: facts
                    label: 事实列表
                    widget: list
                    min: 1
                    fields:
                      - { name: label, label: 名称, widget: string }
                      - { name: value, label: 内容, widget: string }
              - name: contact
                label: 联系方式区
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
                  - { name: guestbookLabel, label: 留言板名称, widget: string }
                  - { name: guestbookAction, label: 留言板说明, widget: string }
                  - { name: qrHint, label: 二维码提示, widget: string }
                  - { name: emailLabel, label: 邮箱标签, widget: string }
                  - { name: wechatLabel, label: 微信标签, widget: string }
                  - { name: githubLabel, label: GitHub 标签, widget: string }
                  - { name: giteeLabel, label: Gitee 标签, widget: string }
                  - { name: wechatQrAlt, label: 二维码替代文本, widget: string }
              - name: note
                label: 底部邀请卡片
                widget: object
                fields:
                  - { name: eyebrow, label: 英文小标题, widget: string }
                  - { name: title, label: 标题, widget: string }
                  - { name: description, label: 描述, widget: text }
                  - { name: cta, label: 按钮文案, widget: string }

      - name: articles
        label: 文章与归档
        file: src/data/articles.json
        format: json
        fields:
          - name: articlesPage
            label: 文章列表页
            widget: object
            fields:
              - { name: title, label: 浏览器标题, widget: string }
              - { name: description, label: 页面描述, widget: text }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: heading, label: 标题, widget: string }
              - { name: intro, label: 说明, widget: text }
              - { name: searchCta, label: 搜索按钮文案, widget: string }
              - { name: readingTimeTemplate, label: 阅读时长模板, widget: string, pattern: ['\{minutes\}', '必须包含 {minutes} 占位符'], hint: '必须包含 {minutes}' }
              - { name: seriesEyebrow, label: 系列小标题, widget: string }
              - { name: seriesTitleTemplate, label: 系列标题模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '{title} 会替换为所属项目标题' }
              - { name: seriesCountTemplate, label: 系列篇数模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}' }
              - { name: seriesPositionTemplate, label: 系列内序号模板, widget: string, pattern: ['^(?=[\s\S]*\{index\})(?=[\s\S]*\{readingTime\})', '必须包含 {index} 与 {readingTime} 占位符'], hint: '必须包含 {index} 与 {readingTime}' }
              - { name: standaloneTitle, label: 独立文章分组标题, widget: string, hint: '未填写所属项目的文章会自动归到这一组' }
          - name: articlePage
            label: 文章详情页
            widget: object
            fields:
              - { name: eyebrowTemplate, label: 页头小标题模板, widget: string, pattern: ['\{minutes\}', '必须包含 {minutes} 占位符'], hint: '必须包含 {minutes}' }
              - { name: updatedPrefix, label: 更新时间前缀, widget: string }
              - { name: tocLabel, label: 文章目录, widget: string }
              - { name: prevLabel, label: 较早文章, widget: string }
              - { name: nextLabel, label: 较新文章, widget: string }
              - { name: pagerAriaLabel, label: 翻页无障碍标签, widget: string }
              - { name: relatedEyebrow, label: 相关文章英文小标题, widget: string }
              - { name: relatedTitle, label: 相关文章标题, widget: string }
              - { name: seriesTemplate, label: 系列标识模板, widget: string, pattern: ['^(?=[\s\S]*\{title\})(?=[\s\S]*\{index\})(?=[\s\S]*\{total\})', '必须包含 {title}、{index}、{total} 占位符'], hint: '必须包含 {title}、{index}、{total}' }
              - { name: coverAltTemplate, label: 封面替代文本模板, widget: string, pattern: ['\{title\}', '必须包含 {title} 占位符'], hint: '文章有封面时使用，{title} 会替换为文章标题' }
          - name: archive
            label: 归档页
            widget: object
            fields:
              - { name: title, label: 浏览器标题, widget: string }
              - { name: description, label: 页面描述, widget: text }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: heading, label: 标题, widget: string }
              - { name: summaryTemplate, label: 汇总模板, widget: string, pattern: ['^(?=[\s\S]*\{count\})(?=[\s\S]*\{years\})', '必须包含 {count} 与 {years} 占位符'], hint: '必须包含 {count} 与 {years}' }
              - { name: cta, label: 全部文章按钮, widget: string }
              - { name: itemUnit, label: 数量单位, widget: string }
              - name: months
                label: 月份名称
                widget: list
                min: 12
                max: 12
                hint: 必须 12 项，按一月到十二月排列
          - name: tagsPage
            label: 标签总览页
            widget: object
            fields:
              - { name: title, label: 浏览器标题, widget: string }
              - { name: descriptionTemplate, label: 页面描述模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}' }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: heading, label: 标题, widget: string }
              - { name: summaryTemplate, label: 汇总模板, widget: string, pattern: ['^(?=[\s\S]*\{count\})(?=[\s\S]*\{articles\})', '必须包含 {count} 与 {articles} 占位符'], hint: '必须包含 {count} 与 {articles}' }
              - { name: cta, label: 全部文章按钮, widget: string }
              - { name: itemUnit, label: 数量单位, widget: string }
          - name: tagPage
            label: 标签详情页
            widget: object
            fields:
              - { name: titleTemplate, label: 浏览器标题模板, widget: string, pattern: ['\{tag\}', '必须包含 {tag} 占位符'], hint: '必须包含 {tag}' }
              - { name: descriptionTemplate, label: 页面描述模板, widget: string, pattern: ['\{tag\}', '必须包含 {tag} 占位符'], hint: '必须包含 {tag}' }
              - { name: eyebrow, label: 英文小标题, widget: string }
              - { name: headingTemplate, label: 标题模板, widget: string, pattern: ['\{tag\}', '必须包含 {tag} 占位符'], hint: '必须包含 {tag}' }
              - { name: countTemplate, label: 文章数量模板, widget: string, pattern: ['\{count\}', '必须包含 {count} 占位符'], hint: '必须包含 {count}' }
              - { name: cta, label: 全部标签按钮, widget: string }
          - name: categoriesPage
            label: 项目分类总览页
            widget: object
            fields:
              - { name: title, label: 浏览器标题, widget: string }
